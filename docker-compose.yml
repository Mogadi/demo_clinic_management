services:
  db:
    image: postgres:16
    container_name: harborlight-db
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
      TZ: Africa/Kigali
    ports:
      - "5433:5432"
    volumes:
      - harborlight_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  harborlight_pg:
